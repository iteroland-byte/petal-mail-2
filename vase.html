<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A flower for you — Petal Post</title>
<link rel="stylesheet" href="styles.css">
</head>
<body data-page="vase">

<div class="world" id="world"></div>

<div class="page" id="page-vase">
  <div class="topbar"><a class="back" href="index.html">← back</a><span class="who" id="vaseWho"></span></div>
  <div class="page-banner"><div class="chapter">A flower for you</div><h2 class="can-perch" id="vaseTitle">A flower is on its way</h2><div class="wavy-rule"></div></div>
  <div class="wrap">
    <p class="vase-note" id="vaseFrom"></p>
    <div class="vase-scene" id="vaseScene">
      <div class="vs-sun"></div>
      <div class="vs-hill-back"></div>
      <div class="vs-tree" style="left:10%;"></div>
      <div class="vs-tree" style="right:12%;"></div>
      <div class="vs-bush" style="left:32%;"></div>
      <div class="vs-bush" style="right:28%;"></div>
      <div class="vase-sill"></div>

      <!-- flowers sit "inside" this stack, which is bottom-anchored at the
           vase mouth so the stage image lines up with assets/vase.png -->
      <div class="vase-stack" id="vaseStack">
        <div class="vase-stem" id="vaseStem"></div>
      </div>

      <div class="vase-pot" id="vasePot">
        <img src="assets/vase.png" alt="" onerror="this.style.display='none'">
        <div class="vase-fallback"><div class="fallback-pot"></div></div>
      </div>
    </div>
    <div class="stage-label can-perch" id="stageLabel">soil, and a seed</div>
    <div class="day-dots" id="dayDots"></div>
    <button class="water-btn can-perch" id="waterBtn">water it 💧</button>
    <div class="wait-countdown" id="waitCountdown"></div>
  </div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
