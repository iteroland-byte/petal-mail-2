<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Send a flower — Petal Post</title>
<link rel="stylesheet" href="styles.css">
</head>
<body data-page="send">

<div class="world" id="world"></div>

<div class="page" id="page-send">
  <div class="topbar"><a class="back" href="index.html">← back</a><span class="who"></span></div>
  <div class="page-banner"><div class="chapter">Chapter One</div><h2 class="can-perch">Send a flower</h2><div class="wavy-rule"></div></div>
  <div class="wrap">
    <label class="field-label">Your handle (so they know who it's from, and so you get notified)</label>
    <input type="text" id="senderHandle" placeholder="your-garden-handle">
    <p class="vase-note" style="margin-top:6px;">No need to know their handle — you'll get a link to send them yourself, any way you like.</p>
    <label class="field-label">Choose a flower — they won't know which until it blooms</label>
    <div class="flower-grid" id="flowerGrid"></div>
    <label class="field-label">A note, sealed until it blooms (optional)</label>
    <textarea id="noteInput" placeholder="Something for them to read on day three..."></textarea>
    <div class="err" id="sendErr"></div>
    <button class="primary-btn can-perch" id="sendBtn">Plant and send</button>
    <div class="link-box" id="linkBox" style="display:none;"></div>
  </div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
