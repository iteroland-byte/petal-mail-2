<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A letter has arrived — Petal Post</title>
<link rel="stylesheet" href="styles.css">
</head>
<body data-page="receive">

<div class="world" id="world"></div>

<div class="page" id="page-receive">
  <div class="topbar"><span></span><span class="who"></span></div>
  <div class="page-banner"><div class="chapter">Someone thought of you</div><h2 class="can-perch">A letter has arrived</h2><div class="wavy-rule"></div></div>
  <div class="wrap" style="text-align:center;">
    <div class="receive-card">
      <div class="receive-seal">💌</div>
      <div class="receive-from-pill" id="receiveFromPill">loading…</div>
      <p class="vase-note" style="margin-top:0;">A little flower has been planted just for you — it's wrapped up as a seed for now, and which one it is stays a mystery until it blooms.</p>
      <button class="primary-btn can-perch" id="openBtn">Open your petal post</button>
    </div>
  </div>
</div>
